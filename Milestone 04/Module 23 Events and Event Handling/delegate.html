<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delegate</title>
</head>
<body>
    <h2>List</h2>
    <ol id="item-list">
        <li class="item">Item - 1</li>
        <li class="item">Item - 2</li>
        <li class="item">Item - 3</li>
        <li class="item">Item - 4</li>
    </ol>

    <button id="btn-add-item">Add Item</button>

    <script>

        // remove Child/item from parentNode
        document.getElementById('item-list')
            .addEventListener('click', function(event){
                console.log(event.target, 'item removed');
                event.target.parentNode.removeChild(event.target)
        })


        // add child/item on parentNode
        document.getElementById('btn-add-item')
            .addEventListener('click', function(){

                console.log('item added');
                // add on parentNode
                const ol = document.getElementById('item-list');

                //new item
                const li = document.createElement('li');
                li.innerText = 'New Item Added'

                // add the item
                ol.appendChild(li);

        })

    </script>
</body>
</html>
